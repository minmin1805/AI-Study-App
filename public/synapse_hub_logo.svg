<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Square background with rounded corners -->
  <rect x="10" y="10" width="100" height="100" rx="20" ry="20" fill="url(#greenGradient)"/>
  
  <!-- Neural Network Hub Icon -->
  <g transform="translate(60, 60)">
    <!-- Central Hub Node -->
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
    
    <!-- 8 Radiating Lines -->
    <line x1="0" y1="0" x2="0" y2="-25" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="18" y2="-18" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="25" y2="0" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="18" y2="18" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="25" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-18" y2="18" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-25" y2="0" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-18" y2="-18" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    
    <!-- End Nodes -->
    <circle cx="0" cy="-25" r="5" fill="#ffffff"/>
    <circle cx="18" cy="-18" r="5" fill="#ffffff"/>
    <circle cx="25" cy="0" r="5" fill="#ffffff"/>
    <circle cx="18" cy="18" r="5" fill="#ffffff"/>
    <circle cx="0" cy="25" r="5" fill="#ffffff"/>
    <circle cx="-18" cy="18" r="5" fill="#ffffff"/>
    <circle cx="-25" cy="0" r="5" fill="#ffffff"/>
    <circle cx="-18" cy="-18" r="5" fill="#ffffff"/>
  </g>
</svg>